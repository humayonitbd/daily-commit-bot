name: Test Daily Commit Bot

on:
  schedule:
    # Prottek 5 minute por por cron run korar jonno
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manual run korar jonno

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Make Automated Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          
          # Protibar run hole file-er modhye timestamp add hobe, jate push korar moto change thake
          echo "Automated trigger check at $(date -u)" >> test-log.txt
          
          git add test-log.txt
          git commit -m "chore: automated check-in commit [skip ci]"
          git push
